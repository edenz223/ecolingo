name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      # Packages an AppImage too, so packaging regressions show up here.
      - run: yarn build
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The smoke tests maximize the window, which needs a window manager and a screen wider than 1100 px.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fluxbox
      - name: Voice activity smoke test
        run: xvfb-run --auto-servernum npx electron tests/voice-activity-smoke.cjs
      # These still assert the UI from before the redesign; report them without blocking until updated.
      - name: Learning UI smoke test
        continue-on-error: true
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash -c 'fluxbox >/dev/null 2>&1 & sleep 2; npx electron tests/learning-ui-smoke.cjs'
      - name: Visual responsiveness smoke test
        continue-on-error: true
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash -c 'fluxbox >/dev/null 2>&1 & sleep 2; npx electron tests/visual-responsiveness-smoke.cjs'
